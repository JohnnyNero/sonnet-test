<!doctype html><meta charset="utf-8"><title>Render slice</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
<canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { MapBuilder } from '../js/level.js';
import { LightField, VisionMask } from '../js/lighting.js';
import { ZONE_TYPES } from '../js/config.js';
import { Renderer } from '../js/renderer.js';
import * as Env from '../js/envkit.js';
import { setBaseURL, initCharacters, createCharacter } from '../js/characters.js';
import { prepareObject, addRim } from '../js/materials.js';
import { RNG } from '../js/util.js';
setBaseURL('../assets/'); Env.setEnvBase('../assets/');
const q=new URLSearchParams(location.search);
await Env.loadManifest();
const M=new MapBuilder(48,36);
M.room('gala',4,4,22,16,{zone:'public',floor:'marble',wall:'panel'});
M.room('kitchen',30,4,12,10,{zone:'staff',floor:'tile',wall:'tile'});
M.room('hall',26,8,4,3,{zone:'staff',floor:'concrete',wall:'concrete'});
M.room('office',30,18,12,10,{zone:'restricted',floor:'carpet',wall:'plaster'});
M.room('alley',4,24,22,8,{zone:'outside',floor:'concrete',wall:'concrete'});
M.door(26,9,'v',{}); M.door(35,14,'h',{}); M.strip('link',35,15,2,3,{zone:'staff',floor:'concrete',wall:'concrete'});
M.door(35,18,'h',{lock:'keycard',model:'security'}); M.strip('link2',14,20,2,4,{zone:'staff',floor:'concrete'}); M.door(14,20,'h',{});
const L=M.finish(); L.seed=7;
const P=(n,x,y,o={})=>M.prop(n,x,y,o);
P('table_round',9,8,{w:2,d:2,h:.8}); P('table_round',15,8,{w:2,d:2,h:.8}); P('table_round',21,8,{w:2,d:2,h:.8}); P('sofa_2',8,17,{w:2,d:1,h:.9,rot:Math.PI}); P('bar_counter',20.5,17.5,{w:1,d:1,h:1.1}); P('bar_counter',21.5,17.5,{w:1,d:1,h:1.1});
P('plant_large',5.5,5.5,{h:1.6}); P('pillar_marble',12.5,13.5,{h:3.2,opaque:true}); P('pillar_marble',18.5,13.5,{h:3.2,opaque:true});
P('counter_kitchen',32.5,5.5,{h:.9}); P('counter_kitchen',33.5,5.5,{h:.9}); P('stove_range',36.5,5.5,{h:1}); P('fridge_large',40.5,5.5,{h:2,opaque:true}); P('cart_catering',35.5,10.5,{h:1});
P('desk_office',34,22,{w:2,d:1,h:.75}); P('desk_office',38,22,{w:2,d:1,h:.75}); P('server_rack',40.5,26.5,{h:2,opaque:true}); P('filing_cabinet',31.5,26.5,{h:1.3});
P('dumpster',8,29,{w:2,d:1,h:1.3}); P('crate_stack',20.5,26.5,{h:1});
const zoneAmb=z=>(ZONE_TYPES[z.type]||ZONE_TYPES.public).ambient;
const field=new LightField(L,zoneAmb); const vision=new VisionMask(L);
const lamp=(x,y,c,i,r=8,o={})=>field.addStatic({x,y,z:3,color:c,intensity:i,range:r,...o});
for (const [x,y] of [[9,8],[15,8],[21,8],[9,15],[17,15]]) lamp(x,y,[1.0,0.80,0.52],0.85,8);
lamp(36,9,[0.9,0.95,1.0],1.2,7); lamp(35,22,[0.75,0.85,1],1.0,7); lamp(35,16.5,[1,.3,.3],.5,3.5);
lamp(10,28,[0.5,0.6,1.0],0.55,10,{}); lamp(20,28,[0.5,0.6,1.0],0.55,10);
field.commit(true);
const R=new Renderer(document.getElementById('c'));
const names=['table_round','sofa_2','bar_counter','plant_large','pillar_marble','counter_kitchen','stove_range','fridge_large','cart_catering','desk_office','server_rack','filing_cabinet','dumpster','crate_stack','wall_plain','wall_panel','wall_tile','wall_concrete','wall_glass','floor_marble','floor_tile','floor_carpet','floor_concrete','door_frame','door_leaf','door_security_frame','door_security_leaf'];
await Env.loadEnvModels(names);
R.buildLevel(L,field,vision);
await initCharacters();
const mk=async(spec,x,y,face,anim)=>{const c=await createCharacter(spec); prepareObject(c.group); c.group.position.set(x,0,y); c.group.rotation.y=face; R.actors.add(c.group); c.play(anim); c.mixer.update(Math.random()); return c;};
const hero=await mk({gender:'male',skin:'light',hair:'buzzed',hairColor:'black',outfit:'thief'},9.5,12.5,Math.PI,q.get('anim')||'Crouch_Idle_Loop');
const guard=await mk({gender:'male',skin:'dark',hair:'buzzed',hairColor:'black',outfit:'guard'},16.5,12,Math.PI/2*1.3,'Idle_Loop');
const guest=await mk({gender:'female',skin:'light',hair:'long',hairColor:'blonde',outfit:'dress'},12.5,8.5,0.5,'Idle_TalkingPhone_Loop');
const waiter=await mk({gender:'female',skin:'dark',hair:'buns',hairColor:'black',outfit:'waiter'},19,9,-1,'Walk_Formal_Loop');
addRim(hero.group); window.__R=R; window.__hero=hero;
vision.update(hero.group.position.x,hero.group.position.z,+(q.get('vr')||16));
R.cam.tYaw=R.cam.yaw=+(q.get('yaw')||0.0); R.cam.tDist=R.cam.dist=+(q.get('dist')||16); R.cam.tPitch=R.cam.pitch=+(q.get('pitch')||1.05);
R.cam.target.set(hero.group.position.x,0.9,hero.group.position.z);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now; for(const c of [hero,guard,guest,waiter]) c.update(dt); R.updateCamera(dt,hero.group.position.x,hero.group.position.z); R.updateWalls(dt,hero.group.position.x,hero.group.position.z); R.animateDoors(L,dt); R.render(dt); requestAnimationFrame(loop);} 
window.__ready=true; requestAnimationFrame(loop);
</script>
